# Instantiated from protocols/templates using bacnet_ip.
# Edit this YAML, then recompile both files; do not hand-edit IR.
format_version: 1
protocol_id: local_bacnet_template
initial: ready
states:
- id: ready
  meaning: UDP endpoint ready; requests independent
- id: pending
  meaning: Confirmed request outstanding, scoped by invoke ID
transitions:
- from: ready
  to: ready
  message: who_is
  response: ''
  guard: valid Who-Is
  actions: []
- from: ready
  to: pending
  message: read_property
  response: read_property_ack
  guard: request sent
  actions:
  - cache invoke_id
- from: pending
  to: ready
  message: read_property_ack
  response: ''
  guard: matching invoke ID
  actions:
  - clear transaction
- from: pending
  to: pending
  message: read_property
  response: read_property_ack
  guard: additional independent invoke
  actions: []
limits:
  max_messages: 32
  max_repeat: 4
  max_bytes: 1048576
invalid_strategy: one explicitly logged length or semantic transition violation; preserve
  other dependencies
