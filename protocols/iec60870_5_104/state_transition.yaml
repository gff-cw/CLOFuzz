format_version: 1
protocol_id: iec60870_5_104
initial: stopped
states:
- id: stopped
  meaning: Data transfer stopped
- id: starting
  meaning: STARTDT confirmation pending
- id: active
  meaning: STARTDT confirmed
- id: stopping
  meaning: STOPDT confirmation pending
transitions:
- from: stopped
  to: starting
  message: start_act
  response: start_con
  guard: TCP connected
  actions: []
- from: starting
  to: active
  message: start_con
  response: ''
  guard: matching STARTDT
  actions: []
- from: active
  to: stopping
  message: stop_act
  response: stop_con
  guard: ''
  actions: []
- from: stopping
  to: stopped
  message: stop_con
  response: ''
  guard: ''
  actions: []
- from: active
  to: active
  message: interrogation
  response: ''
  guard: increment N(S) modulo 32768
  actions:
  - cache send sequence
- from: active
  to: active
  message: s_ack
  response: ''
  guard: acknowledge received I frames
  actions: []
- from: active
  to: active
  message: test_act
  response: ''
  guard: TESTFR keepalive
  actions: []
- from: active
  to: active
  message: test_con
  response: ''
  guard: TESTFR keepalive
  actions: []
- from: stopped
  to: stopped
  message: test_act
  response: test_con
  guard: TESTFR is independent of data-transfer activation
  actions: []
- from: stopped
  to: stopped
  message: test_con
  response: ''
  guard: TESTFR is independent of data-transfer activation
  actions: []
limits:
  max_messages: 32
  max_repeat: 4
  max_bytes: 1048576
invalid_strategy: one explicitly logged length or semantic transition violation; preserve
  other dependencies
