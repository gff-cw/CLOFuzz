format_version: 1
protocol_id: ethernet_ip_cip_tcp
name: EtherNet/IP and CIP explicit TCP
version: Encapsulation v1; public OpENer implementation
scope: 'Reviewed bounded EtherNet/IP encapsulation v1 source input: RegisterSession success and status
  0x69 failure, no-reply UnregisterSession, SendRRData GetAttributeSingle Identity Vendor-ID success/status
  0x14, SendRRData invalid-session status 0x64, and externally provisioned SendUnitData Vendor-ID success.
  All ten complete original wire examples are retained; no ForwardOpen/ForwardClose or automatic class-3
  provisioning is implemented. This source pair has not undergone native revalidation.'
transport: tcp
framing: protocol length inside replayable records
codec: enip
support:
  runtime: true
  level: existing bounded C codec; reviewed source input; native revalidation pending
  excluded:
  - ForwardOpen/ForwardClose fixture generation and automatic class-3 connection establishment (external
    prerequisite for SendUnitData)
  - implicit UDP I/O
  - CIP Security
  - other CIP objects/services
  - full subscription-only ODVA normative conformance
  - Encapsulation error commands/statuses beyond register 0x69 and SendRRData 0x64 in this model
  - Connected CIP error responses and CIP general statuses other than the declared SendRRData 0x14 error
  - EPATH classes/instances/attributes other than Identity 1/1/1 and nonlogical segment forms
  - Generic-wire execution of this complete profile; the separate migration inventory is offline-only
  - Enforcement of class-3 establishment/expiry or external connection-ID provisioning by guard/actions
