# Reviewed source input; native compilation and target execution have not been performed for this copy.
format_version: 1
protocol_id: ethernet_ip_cip_tcp
initial: connected
states:
- id: connected
  meaning: TCP connected; session unregistered
- id: registering
  meaning: RegisterSession response pending
- id: registered
  meaning: Successful response assigned nonzero session handle; class-3 connection availability is a separate
    external prerequisite, never implied by this state; this is only a model state and does not certify
    the external connection
- id: closed
  meaning: Session unregistered/transport closed
transitions:
- from: connected
  to: registering
  message: register
  response: register_response
  guard: ''
  actions: []
- from: registering
  to: registered
  message: register_response
  response: ''
  guard: status=0; version=1; nonzero assigned handle
  actions:
  - cache peer session handle
- from: registering
  to: connected
  message: register_error
  response: ''
  guard: nonzero encapsulation status
  actions: []
- from: registered
  to: registered
  message: send_rr
  response: send_rr_response
  guard: valid session; cache Sender Context
  actions: []
- from: registered
  to: registered
  message: send_rr_response
  response: ''
  guard: echoed context, service bit7, general status=0
  actions: []
- from: registered
  to: registered
  message: send_rr_error
  response: ''
  guard: echoed context and nonzero CIP general status
  actions: []
- from: registered
  to: registered
  message: send_unit
  response: send_unit_response
  guard: 'EXTERNAL PRECONDITION: successful ForwardOpen already established an unexpired class-3 explicit
    connection on this session; use external O->T consumed ID and T->O produced ID'
  actions:
  - 'static annotation: class-3 connection/IDs must be supplied externally; current sequence writer starts
    from its own cache, not an external negotiation result'
- from: registered
  to: registered
  message: send_unit_response
  response: ''
  guard: external class-3 connection remains established; produced T->O ID; echoed connected sequence
    and Sender Context
  actions:
  - clear selected connected request context
- from: registered
  to: connected
  message: invalid_session
  response: ''
  guard: encapsulation status invalid session
  actions:
  - 'static annotation: peer session invalid; guard/actions do not clear the runtime cache'
- from: registered
  to: closed
  message: unregister
  response: ''
  guard: matching session handle; no reply
  actions:
  - 'static annotation: closed model state; guard/actions do not implement external connection cleanup'
limits:
  max_messages: 32
  max_repeat: 4
  max_bytes: 1048576
invalid_strategy: one explicitly logged length or semantic transition violation; preserve other dependencies
