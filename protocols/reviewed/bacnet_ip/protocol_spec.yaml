format_version: 1
protocol_id: bacnet_ip
name: BACnet/IP
version: BACnet Stack 1.5.0 / ASHRAE 135
scope: Unsegmented Who-Is/I-Am and ReadProperty request/ACK/Error/Reject/server-Abort
  with dynamic routed NPDU and typed BACnet tag locators; one pending confirmed request.
transport: udp
framing: datagram
codec: bacnet
support:
  runtime: true
  level: runtime scoped codec; controlled API tests
  excluded:
  - segmented APDUs
  - BACnet/SC
  - other services runtime encoding
  - BBMD/foreign-device lifecycle
  - parallel confirmed invokes
  - arbitrary property-value interpretation
