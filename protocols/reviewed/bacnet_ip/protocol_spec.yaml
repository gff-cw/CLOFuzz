# Static reviewed input candidate; no native validation or runtime acceptance is asserted.
# Creation sources and exact scope are recorded in README.md and constraints.json.
format_version: 1
protocol_id: bacnet_ip
name: BACnet/IP
version: BACnet Stack 1.5.0 / ASHRAE 135
scope: 'Reviewed un-routed BVLC Original-Unicast-NPDU profile: unsegmented Who-Is/I-Am
  and ReadProperty request/ACK/Error/Reject/server-Abort fixture layouts. NPDU control
  is fixed to each fixture (Who-Is/responses=0, ReadProperty=4). Only Who-Is/ReadProperty
  have request encoders. I-Am/Error/Reject/Abort absolute response slices describe
  these fixtures, not arbitrary tag widths or routed responses.'
transport: udp
framing: datagram
codec: bacnet
support:
  runtime: true
  level: runtime scoped codec; reviewed candidate, native acceptance pending
  excluded:
  - segmented APDUs
  - BACnet/SC
  - other services runtime encoding
  - BBMD/foreign-device lifecycle
  - routed NPDU generation/recognition by this reviewed model (request parser capability
    is broader)
  - general dynamic I-Am/Error parameter tag widths; response absolute slices are
    fixture-specific
  - parallel confirmed invokes and executable state guards/actions
