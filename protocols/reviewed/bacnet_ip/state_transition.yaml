# Static reviewed input candidate; no native validation or runtime acceptance is asserted.
# Creation sources and exact scope are recorded in README.md and constraints.json.
format_version: 1
protocol_id: bacnet_ip
initial: ready
states:
- id: ready
  meaning: UDP endpoint ready; requests independent
- id: pending
  meaning: One confirmed ReadProperty request outstanding; the host allows one pending
    request per session, not parallel invoke contexts.
transitions:
- from: ready
  to: ready
  message: who_is
  response: i_am
  guard: One pending request at a time; I-Am completion is expected by this model.
    Guard text is descriptive only.
  actions: []
- from: ready
  to: pending
  message: read_property
  response: read_property_ack
  guard: No pending request; runtime single-flight check applies independently of
    this descriptive guard.
  actions:
  - cache invoke_id
- from: pending
  to: ready
  message: read_property_ack
  response: ''
  guard: Matching current invoke ID; only one current request exists. Guard/action
    strings do not execute.
  actions:
  - clear transaction
- from: ready
  to: ready
  message: i_am
  response: ''
  guard: unsolicited or matching Who-Is device range
  actions: []
- from: pending
  to: ready
  message: read_property_error
  response: ''
  guard: Matching current invoke ID; only one current request exists. Guard/action
    strings do not execute.
  actions:
  - clear selected invoke context
- from: pending
  to: ready
  message: reject
  response: ''
  guard: Matching current invoke ID; only one current request exists. Guard/action
    strings do not execute.
  actions:
  - clear selected invoke context
- from: pending
  to: ready
  message: abort
  response: ''
  guard: Matching current invoke ID; only one current request exists. Guard/action
    strings do not execute.
  actions:
  - clear selected invoke context
limits:
  max_messages: 32
  max_repeat: 4
  max_bytes: 1048576
invalid_strategy: one explicitly logged length or semantic transition violation; preserve
  other dependencies
