# Reviewed source input; native compilation and target execution have not been performed for this copy.
format_version: 1
protocol_id: opcua_tcp
initial: tcp
states:
- id: tcp
  meaning: TCP connected
- id: hello_sent
  meaning: HEL sent; ACK pending
- id: acknowledged
  meaning: HEL/ACK model progression; buffer upper-bound negotiation is not enforced by guard/actions
- id: channel_pending
  meaning: OpenSecureChannel Issue sent
- id: channel
  meaning: Successful OpenSecureChannel response model state; channel/token bound, no Session; token-expiry
    enforcement is not implemented by this state
- id: closed
  meaning: Transport/channel closed
transitions:
- from: tcp
  to: hello_sent
  message: hello
  response: ack
  guard: ''
  actions: []
- from: hello_sent
  to: acknowledged
  message: ack
  response: ''
  guard: negotiation accepted
  actions: []
- from: acknowledged
  to: channel_pending
  message: open_channel
  response: open_channel_response
  guard: SecurityPolicy None; request type Issue
  actions: []
- from: channel_pending
  to: channel
  message: open_channel_response
  response: ''
  guard: service_result Good; channel/token assigned
  actions:
  - 'static annotation: model records channel/token response; guard/actions do not run an expiry timer'
- from: channel
  to: channel
  message: message
  response: message_response
  guard: token valid; GetEndpoints requires no Session
  actions:
  - 'static annotation: runtime dependencies implement declared binding/correlation; peer sequence freshness
    and token expiry require additional runtime handling'
- from: channel
  to: channel
  message: message_response
  response: ''
  guard: matching request ID/handle
  actions:
  - 'static annotation: runtime dependencies implement declared binding/correlation; peer sequence freshness
    and token expiry require additional runtime handling'
- from: channel
  to: channel
  message: service_fault
  response: ''
  guard: matching request ID/handle; Bad status
  actions:
  - 'static annotation: runtime dependencies implement declared binding/correlation; peer sequence freshness
    and token expiry require additional runtime handling'
- from: channel
  to: closed
  message: close_channel
  response: ''
  guard: no response expected
  actions:
  - 'static annotation: closed model state; arbitrary actions do not clear runtime channel/token caches'
- from: tcp
  to: tcp
  message: reverse_hello
  response: ''
  guard: reverse-connect role only
  actions: []
- from: tcp
  to: closed
  message: error
  response: ''
  guard: transport error closes connection
  actions: []
- from: hello_sent
  to: closed
  message: error
  response: ''
  guard: transport error closes connection
  actions: []
- from: acknowledged
  to: closed
  message: error
  response: ''
  guard: transport error closes connection
  actions: []
- from: channel_pending
  to: closed
  message: error
  response: ''
  guard: transport error closes connection
  actions: []
- from: channel
  to: closed
  message: error
  response: ''
  guard: transport error closes connection
  actions: []
limits:
  max_messages: 32
  max_repeat: 4
  max_bytes: 1048576
invalid_strategy: one explicitly logged length or semantic transition violation; preserve other dependencies
