# Reviewed editable source only; no native compilation or target acceptance is asserted.
format_version: 1
protocol_id: modbus_tcp
name: Modbus TCP
version: Application Protocol 1.1b3; MBAP
scope: 'Reviewed Modbus TCP MBAP client request/response profile: FC01/02/03/04 reads,
  FC05/06 single writes and FC0F/10 multiple writes; all normal layouts plus request-specific
  exception responses. FC0F includes non-byte-aligned quantities. Scalar correlation
  and codec structural repair are represented; live read-quantity response equations,
  address-span semantics and concurrent transactions remain explicit execution gaps.'
transport: tcp
framing: protocol length inside replayable records
codec: modbus
support:
  runtime: true
  level: runtime scoped codec
  excluded:
  - serial RTU
  - file-record and diagnostic function families
sources:
- id: wire
  url: https://github.com/stephane/libmodbus/blob/master/src/modbus.c
  basis: implementation
  sections: libmodbus src/modbus.c and modbus-tcp.c; Modbus Application Protocol 1.1b3
    sections 4,6
