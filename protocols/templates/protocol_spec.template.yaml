# ICP-IR v1 已有六种 codec 的配置模板。
# 本文件编译为旧 protocol_ir.json，不是 stateafl.generic-wire 的前端。
# 修改 protocol_id 仅更名配置；不会生成新协议的编码器。
# {{...}} 是待填写项；本文件不能直接作为某个真实协议的线格式。
# 推荐用 tools/init_protocol_spec.py 按下述结构填入已有协议配置，避免手填遗漏。
format_version: 1
protocol_id: "{{protocol_id}}"   # 两份文件必须相同，例如 bacnet_ip
name: "{{name}}"
version: "{{version}}"
scope: "{{scope}}"               # 精确写明服务、编码和测试范围
transport: "{{transport}}"       # udp / tcp
framing: "{{framing}}"           # 旧格式中的说明字符串，不是通用引擎的framing对象
codec: "{{codec}}"               # bacnet / modbus / iec104 / mms / enip / opcua
support:
  runtime: false                  # 只有已经实现 C codec 的配置才能改为 true
  level: "{{support_level}}"
  excluded: []
sources:
  - id: wire
    url: "{{source_url}}"
    basis: implementation          # normative / implementation / inferred
    sections: "{{source_sections}}"
messages:
  - id: "{{message_id}}"          # 每种请求/响应单独建模，标识符不能重复
    direction: request             # request / response
    weight: 1
    fixture_status: complete       # complete / fragment；后者不能用于runtime=true
    runtime_encode: false          # 能力声明非开关；runtime=true的request必须true，其余false
    match: "{{message_id}}"        # 解释性标签；实际匹配使用 codec 和 fixed 字段
    example: "{{wire_hex}}"        # 完整协议消息的十六进制，不含 LE32 replay 长度
    # blocks/path/structure_model是元数据；role与locator才决定当前C执行器的字段行为。
    blocks:
      - id: HEAD
        fields: [command, total_length]
      - id: CONTENT
        fields: [payload]
    fields:
      # 以下是字段定义形状，不是某个工控协议的真实偏移/编码。
      # 应按协议源码/规范修改 id、locator、type、width、endian 等。
      - id: command
        block: HEAD
        path: header.command
        locator: "{{command_locator}}" # 固定布局 abs:N；动态布局使用 codec 定位器
        type: uint8
        width: 1
        endian: big
        role: head                 # head / content / fixed / derived
        mutability: fuzzable       # fixed / fuzzable / derived / conditional / runtime_bound
        default: 0                 # 描述性默认值；执行器从example取模板，不按default重写
        min: 0                     # 解析/解码的物理数值下界；任何变异候选必须满足 min <= value <= max
        max: 255                   # 解析/解码的物理数值上界
        values: []                 # HEAD变异时的离散枚举候选值池；它不作为对端响应解析的封闭过滤器，且内部值必须严格落在 [min, max] 范围内
        strategies: [enum, boundary, bitflip, arithmetic] # HEAD标量策略；空列表使用这四种默认值
        evidence: wire
        confidence: implementation
      - id: total_length
        block: HEAD
        path: header.length
        locator: "{{length_locator}}"
        type: uint16
        width: 2
        endian: big
        role: derived
        mutability: derived
        default: 0
        min: 0
        max: 65535
        values: []
        strategies: []
        evidence: wire
        confidence: implementation
      - id: payload
        block: CONTENT
        path: payload
        locator: "{{payload_locator}}"
        type: bytes                # 可变长字段 width=0；按协议选择 bacnet_tags/ber_tlv 等
        width: 0
        endian: big
        role: content
        mutability: fuzzable
        default: ""                # bytes/tags/BER等为连续十六进制；string为UTF-8文本
        min: 0
        max: 4096
        values: []
        strategies: [afl, resize]   # CONTENT策略仅作注释；当前实现用AFL字节投影/专用codec
        evidence: wire
        confidence: implementation
    dependencies:
      - op: length_of
        target: total_length
        source: $message           # 也可引用某个字段；不是所有长度都等于整个报文
        unit: 1                    # 除以单位（要求整除），再加 add
        add: 0                     # 例如 MBAP 长度不含前6字节，应为 -6
    notes: "{{message_notes}}"
# role=fixed与mutability=fixed必须同时设置；整数min=max=default=实际固定值。
# 静态固定bytes/string则min=max=default的字节长度；runtime不支持固定blob匹配。
# role=derived与mutability=derived必须同时设置，且恰有一条dependencies写入它。
# runtime_bound必须有copy/bind/correlation/sequence依赖；条件字段不等于执行when表达式。
# example是运行时真正的消息模板；执行器检查其字段范围，default不要求等于example。
# 跨消息依赖：{op: copy_from_message, target: 当前字段ID,
#              message: 前置消息ID, source: 前置字段ID}
# 响应绑定：bind_from_response；响应尚未到达时不能凭空生成绑定值。
# 条件/嵌套/重复结构的静态描述见现有六种具体模型及语言文档；
# 描述结构并不代表运行时已经实现对应编码器。
# dependencies.scope和dependencies.when仅记录说明；不会创建独立缓存或执行条件。
# 静态协议完整性由fixture_status声明；编译通过不代表已通过真实服务器交换。
# match/path/default/structure_model及状态guard/actions不是可执行表达式。
# 迁移脚本不是通用编译器；本文件修改不保证等价更新generic_wire.json。
