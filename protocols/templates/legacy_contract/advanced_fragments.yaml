format: stateafl.legacy-capability-fragments
version: 1
use: Contextual schema fragments; not standalone protocol files and not merge instructions.
  Source profile excerpts preserve real declarations; synthetic rule-only entries
  claim no industrial wire semantics.
runtime_tests_executed: false
fragments:
- id: length_of
  classification: executed
  scope: legacy-codec
  source:
    kind: profile_excerpt
    profile: modbus_tcp
    message: read_coils
    source_file: protocols/modbus_tcp/protocol_spec.yaml
    source_sha256: 3e76eecd88f46f08f065f6ed5702ae5a25d689aa3dc638a97cdac0267f21378f
  schema_pointer: '#/properties/messages/items/properties/dependencies/items'
  selection:
    op: length_of
    target: length
    source: $message
    add: -6
  context:
    fields:
      read_coils:
      - id: length
        block: HEAD
        path: abs:4
        locator: abs:4
        type: uint16
        width: 2
        endian: big
        role: derived
        mutability: derived
        default: 0
        min: 0
        max: 65535
        values: []
        strategies:
        - enum
        - boundary
        - bitflip
        - arithmetic
        evidence: official
        confidence: normative
    message_direction: request
  requirements:
  - The target must be a scalar derived field with exactly one writer.
  - The local source byte length must be divisible by unit; result=(bytes/unit)*multiply+add.
  - This real MBAP rule uses add=-6; it does not add a checksum or new service to
    Modbus.
