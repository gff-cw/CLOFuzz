format_version: 1
protocol_id: opcua_tcp
name: OPC UA TCP
version: OPC10000 Part4/6 v1.05 / asyncua interoperability profile
scope: Complete HEL/ACK/ERR/RHE and single-final-chunk UASC SecurityPolicy None Issue
  OpenSecureChannel request/response, GetEndpoints Discovery request/response, ServiceFault,
  implementation-profile CloseSecureChannel. Complete UA Binary headers and nested
  endpoint/token arrays; bounded runtime codec and structural repair; Session services
  excluded.
transport: tcp
framing: protocol length inside replayable records
codec: opcua
support:
  runtime: true
  level: runtime scoped codec
  excluded:
  - signing/encryption and certificates
  - OpenSecureChannel Renew and token-overlap behavior
  - CreateSession/ActivateSession and authenticated/session services
  - intermediate/abort chunks and runtime reassembly
  - whole-standard conformance; CLO normative wording difference unresolved
sources:
- id: wire
  url: https://github.com/FreeOpcUa/opcua-asyncio/tree/c321a240e53d083fd6e167c67f795915d8f236fd/asyncua/ua
  basis: implementation
  sections: 'ua_binary.py and generated uaprotocol_auto.py: all service fixtures decoded
    completely and re-encoded byte-for-byte; no network exchange'
- id: services
  url: https://reference.opcfoundation.org/specs/OPC-10000-4/5.5.1
  basis: normative
  sections: Discovery service set; Session not required
- id: nodeids
