format_version: 1
protocol_id: opcua_tcp
name: OPC UA TCP
version: OPC 10000 Parts 4/6 v1.05
scope: HEL/ACK/ERR/RHE transport and UASC OPN/MSG/CLO header structures, UA Binary/NodeId
  and lifecycle descriptions. Only SecurityPolicy None is described.
transport: tcp
framing: protocol length inside replayable records
codec: opcua
support:
  runtime: false
  level: static description; runtime encoder unavailable
  excluded:
  - signed or encrypted security modes
  - complete service bodies
  - session activation
  - runtime chunk reassembly
  - CreateSession/ActivateSession request bodies and authentication are not generated
sources:
- id: wire
  url: https://reference.opcfoundation.org/specs/OPC-10000-6
  basis: implementation
  sections: 5.2 UA Binary; 6.7 UASC; 7.1 UACP
- id: official
  url: https://reference.opcfoundation.org/specs/OPC-10000-6
  basis: normative
  sections: Part 6 sections 5.2 UA Binary, 6.7 UASC, 7.1 UACP; SecurityPolicy None
    scope
