validation:
  protocol: modbus_tcp
  messages: 19
  fields: 138
  semantic_states: 1
  validated: true
  runtime: true
  scope: Modbus TCP MBAP plus FC01/02/03/04 reads, FC05/06 single writes, FC0F/10
    multiple writes; all normal response layouts and generic exception layout; FC0F
    arbitrary 1..1968 coils including final-byte padding. Bounded runtime codec and
    structural repair.
