format_version: 1
protocol_id: modbus_tcp
name: Modbus TCP
version: Application Protocol 1.1b3; MBAP
scope: Modbus TCP MBAP plus FC01/02/03/04 reads, FC05/06 single writes, FC0F/10 multiple
  writes; all normal response layouts and generic exception layout; FC0F arbitrary
  1..1968 coils including final-byte padding. Complete static profile; no runtime
  encoder.
transport: tcp
framing: protocol length inside replayable records
codec: modbus
support:
  runtime: false
  level: static description; runtime encoder unavailable
  excluded:
  - serial RTU
  - file-record and diagnostic function families
sources:
- id: wire
  url: https://github.com/stephane/libmodbus/blob/master/src/modbus.c
  basis: implementation
  sections: libmodbus src/modbus.c and modbus-tcp.c; Modbus Application Protocol 1.1b3
    sections 4,6
- id: official
  url: https://www.modbus.org/file/secure/modbusprotocolspecification.pdf
  basis: normative
  sections: Application Protocol V1.1b3 sections 4, 6.1-6.6, 6.11-6.12 and 7
