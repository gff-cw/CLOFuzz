format_version: 1
protocol_id: ethernet_ip_cip_tcp
name: EtherNet/IP and CIP explicit TCP
version: Encapsulation v1; public OpENer implementation
scope: Encapsulation lifecycle, SendRRData/SendUnitData CPF and CIP path description.
  No implicit UDP I/O.
transport: tcp
framing: protocol length inside replayable records
codec: enip
support:
  runtime: false
  level: static description; runtime encoder unavailable
  excluded:
  - implicit UDP I/O
  - ForwardOpen runtime binding
  - CIP Security
  - subscription-only ODVA details not independently verified
