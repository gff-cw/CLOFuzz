format_version: 1
protocol_id: ethernet_ip_cip_tcp
name: EtherNet/IP and CIP explicit TCP
version: Encapsulation v1; public OpENer implementation
scope: EtherNet/IP TCP RegisterSession success/failure, UnregisterSession (no reply),
  SendRRData (NullAddress + UnconnectedData), SendUnitData (ConnectedAddress + ConnectedData
  with UInt16 class-3 sequence), complete GetAttributeSingle Identity Vendor-ID request/response
  layouts and encapsulation/CIP errors. SendUnitData requires an externally successful
  ForwardOpen establishing class-3 connection and supplying directional IDs; this
  model does not establish that prerequisite. Bounded runtime explicit-message codec
  and structural repair.
transport: tcp
framing: protocol length inside replayable records
codec: enip
support:
  runtime: true
  level: runtime scoped codec
  excluded:
  - ForwardOpen/ForwardClose fixture generation and automatic class-3 connection establishment
    (external prerequisite for SendUnitData)
  - implicit UDP I/O
  - CIP Security
  - other CIP objects/services
  - full subscription-only ODVA normative conformance
sources:
- id: wire
  url: https://github.com/EIPStackGroup/OpENer/tree/d8820ef41ce30dda06d213438ba81c81de33ffe2/source/src
  basis: implementation
  sections: encap.c; cpf.c NotifyConnectedCommonPacketFormat/AssembleLinearMessage;
    cipconnectionmanager.c GetConnectedObject/AssembleForwardOpenResponse; cipclass3connection.c
    EstablishClass3Connection. ForwardOpen request is not a verified fixture in this
    profile.
- id: official
  url: https://www.odva.org/subscriptions-services/specifications/
  basis: inferred
  sections: ODVA catalogue/subscription boundary only; paid volumes not consulted;
    wire details from OpENer
