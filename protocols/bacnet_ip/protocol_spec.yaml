  - id: service
    block: HEAD
    path: apdu.service
    locator: apdu.service
    type: uint8
    width: 1
    endian: big
    role: fixed
    mutability: fixed
    default: 8
    min: 8
    max: 8
    values:
    - 8
    strategies:
    - enum
    - boundary
    - bitflip
    - arithmetic
    evidence: wire
    confidence: implementation
  - id: limits
    block: CONTENT
    path: apdu.content
    locator: apdu.content
    type: bacnet_tags
    width: 0
    endian: big
    role: content
    mutability: fuzzable
    default: ''
    min: 0
    max: 4096
    values: []
    strategies:
    - afl
    - resize
    evidence: wire
    confidence: implementation
    structure: Optional context [0] low and [1] high device-instance limits (0..4194303),
      both absent or both present.
    structure_model:
      id: device_limits
      kind: choice
      children:
      - id: absent
        kind: field
        type: empty
        condition: both limits absent
      - id: range
        kind: sequence
        children:
        - id: low
          kind: field
          type: context-unsigned
          tag: 0
          min: 0
          max: 4194303
        - id: high
          kind: field
          type: context-unsigned
          tag: 1
          min: 0
          max: 4194303
        condition: both present; low <= high <= 4194303
      encoding: BACnet-LVT
