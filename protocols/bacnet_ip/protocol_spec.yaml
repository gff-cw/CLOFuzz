format_version: 1
protocol_id: bacnet_ip
name: BACnet/IP
version: BACnet Stack 1.5.0 / ASHRAE 135
scope: BVLC Original-Unicast-NPDU, optional routed NPDU addresses; unsegmented Who-Is/I-Am;
  ReadProperty request/ACK/Error and Reject/server-Abort. Runtime generates only Who-Is
  and ReadProperty requests; response layouts are complete static descriptions.
transport: udp
framing: datagram
codec: bacnet
support:
  runtime: true
  level: runtime scoped codec
  excluded:
  - segmented APDUs
  - BACnet/SC
  - other services runtime encoding
  - BBMD/foreign-device lifecycle
sources:
