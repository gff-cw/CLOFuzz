format_version: 1
protocol_id: bacnet_ip
name: BACnet/IP
version: BACnet Stack 1.5.0 / ASHRAE 135
scope: BVLC Original-Unicast-NPDU; routed NPDU address parsing; unsegmented Who-Is
  with optional limits and ReadProperty with optional array index; application/context
  tag walking and invoke correlation.
transport: udp
framing: datagram
codec: bacnet
support:
  runtime: true
  level: runtime scoped codec
  excluded:
  - segmented APDUs
  - BACnet/SC
  - other services runtime encoding
  - BBMD/foreign-device lifecycle
sources:
- id: wire
  url: https://github.com/bacnet-stack/bacnet-stack/tree/bacnet-stack-1.5.0
  basis: implementation
  sections: src/bacnet/{npdu,bacdcode,rp}.c; datalink/bvlc.c; apps/server/main.c
- id: official
  url: https://www.ashrae.org/technical-resources/standards-and-guidelines/titles-purposes-and-scopes
  basis: implementation
  sections: ASHRAE 135 catalogue identity only; wire semantics verified against local
    BACnet Stack 1.5.0
