    strategies:
    - enum
    - boundary
    - bitflip
    - arithmetic
    evidence: wire
    confidence: implementation
  - &id004
    id: npdu_version
    block: HEAD
    path: npdu.version
    locator: npdu.version
    type: uint8
    width: 1
    endian: big
    role: fixed
    mutability: fixed
    default: 1
    min: 1
    max: 1
    values:
    - 1
    strategies:
    - enum
    - boundary
    - bitflip
    - arithmetic
    evidence: wire
    confidence: implementation
  - &id005
    id: npdu_control
    block: HEAD
    path: npdu.control
    locator: npdu.control
    type: uint8
    width: 1
    endian: big
    role: head
    mutability: conditional
    default: 0
    min: 0
    max: 255
    values:
    - 0
    - 4
    - 32
    - 8
    strategies:
    - enum
    - boundary
    - bitflip
    - arithmetic
    evidence: wire
    confidence: implementation
    structure: Destination DNET/DLEN/DADR and source SNET/SLEN/SADR appear when NPDU
      control bits 5 and 3 are set; hop count follows addresses only for destination;
      reject network-layer bit 7 in runtime APDU scope.
    structure_model:
      id: npdu_addresses
      kind: sequence
      children:
      - id: dnet
        kind: field
        type: uint16-big
        condition: control bit5 set
      - id: dlen
        kind: field
        type: uint8
        condition: control bit5 set
      - id: dadr
        kind: repeat
        children:
        - id: address_octet
          kind: field
          type: uint8
        min: 0
        max: 255
        condition: DLEN octets when control bit5 set
      - id: snet
        kind: field
        type: uint16-big
        condition: control bit3 set
      - id: slen
        kind: field
        type: uint8
        condition: control bit3 set
      - id: sadr
        kind: repeat
        children:
        - id: address_octet
          kind: field
          type: uint8
        min: 1
        max: 255
        condition: SLEN octets when control bit3 set
      - id: hop_count
        kind: field
        type: uint8
        condition: control bit5 set
      encoding: BACnet-NPDU
  - id: apdu_type
    block: HEAD
    path: apdu.type
    locator: apdu.type
    type: uint8
    width: 1
    endian: big
    role: fixed
    mutability: fixed
    default: 16
    min: 16
    max: 16
    values:
