format_version: 1
protocol_id: iec61850_mms_tcp
name: IEC 61850 MMS over TCP
version: IEC 61850-8-1 / ISO 9506 / RFC 1006
scope: Transport COTP plus declarative ACSE/Initiate/confirmed GetNameList Read Write
  envelopes; nested BER; full session/presentation association requires an external
  complete codec.
transport: tcp
framing: protocol length inside replayable records
codec: mms
support:
  runtime: false
  level: static description; runtime encoder unavailable
  excluded:
  - complete session/presentation codec
  - runtime BER service encoding
  - all abstract IEC61850 services
  - TLS
sources:
- id: wire
  url: https://github.com/mz-automation/libiec61850/tree/master/src/mms
  basis: implementation
  sections: iso_mms ASN.1 definitions, iso_acse and iso_presentation; RFC1006 section
    6
- id: official
  url: https://www.rfc-editor.org/rfc/rfc1006
  basis: normative
  sections: RFC 1006 section 6 TPKT; MMS/ACSE semantics from libIEC61850 implementation
- id: iec_scope
  url: https://webstore.iec.ch/en/publication/6021
  basis: inferred
  sections: IEC 61850-8-1 catalogue; paid normative text not consulted
