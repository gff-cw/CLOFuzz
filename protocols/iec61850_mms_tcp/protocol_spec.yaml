format_version: 1
protocol_id: iec61850_mms_tcp
name: IEC 61850 MMS over TCP
version: RFC1006 / libIEC61850 v1.6 profile
scope: Complete TPKT/COTP TP0, session/presentation normal-mode association, ACSE
  AARQ/AARE with embedded MMS initiate, VMD-domain GetNameList, one domain-specific
  named-variable Read/Write, MMS conclude and ACSE/session release, all successful
  request/response layouts. Bounded runtime codec with BER definite lengths and structural
  repair.
transport: tcp
framing: protocol length inside replayable records
codec: mms
support:
  runtime: true
  level: runtime scoped codec
  excluded:
  - full IEC61850 ACSI mapping
  - reports/GOOSE/SV
  - generalized arrays/alternate access and data-set services
  - arbitrary ACSE authentication
  - association rejection/abort and MMS confirmed-error/reject fixtures unverified
  - TLS
  - arbitrary BER container generation
sources:
- id: wire
  url: https://github.com/mz-automation/libiec61850/tree/6d231326bff8e9b6500aa1e345c076d3a329f211/src/mms
  basis: implementation
  sections: iso_cotp, iso_session, iso_presentation, iso_acse, iso_mms client/server
    and asn1c definitions; complete loopback fixtures constructed with this revision
- id: iec_scope
  url: https://webstore.iec.ch/en/publication/6021
  basis: inferred
  sections: IEC61850-8-1 catalogue only; paid normative MMS/IEC texts not consulted
- id: official
  url: https://www.rfc-editor.org/rfc/rfc1006
  basis: normative
  sections: RFC 1006 section 6 TPKT/COTP only; MMS/ACSE/session/presentation from
