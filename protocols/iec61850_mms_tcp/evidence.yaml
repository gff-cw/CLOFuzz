availability: Public OPC Foundation, RFC1006, Modbus current official PDF and open-source
  implementations were consulted. Full ASHRAE, IEC and ODVA subscription texts were
  not accessed.
distinctions: semantic state IDs are unrelated to StateAFL memory-derived IDs
fixture_counts:
  complete: 14
  fragment: 0
fixture_verification: 'Independent bounded structural readers: tests/protocol/test_model_completeness.py.
  Compiler validation covers the documented envelope/runtime subset, not complete
  service conformance.'
fixture_provenance: Complete loopback reference exchanges at libIEC61850 commit 6d231326bff8e9b6500aa1e345c076d3a329f211,
  connect/GetNameList/Read/Write/conclude all returned error=0. This constructs static
  fixtures; it is not StateAFL integration coverage.
validation:
  protocol: iec61850_mms_tcp
  messages: 14
  fields: 136
  semantic_states: 9
  validated: true
  runtime: true
  scope: Complete TPKT/COTP TP0, session/presentation normal-mode association, ACSE
    AARQ/AARE with embedded MMS initiate, VMD-domain GetNameList, one domain-specific
    named-variable Read/Write, MMS conclude and ACSE/session release, all successful
    request/response layouts. Bounded runtime codec with BER definite lengths and
    structural repair.
  example_validation: protocol envelope and length consistency; bounded runtime codec
    validates complete fixtures and exact field ranges; not live service conformance
  message_aliases: {}
  execution_contract:
    static_only: false
    static_metadata:
      protocol:
      - name
      - version
      - scope
      - framing
      - sources
      message:
      - match
      - blocks
      - notes
      - fixture_status
      - runtime_encode
      field:
      - block
      - path
      - default
      - evidence
      - confidence
      - structure
      - structure_model
      dependency:
      - scope
      - when
      state:
      - states[].meaning
      - transitions[].guard
      - transitions[].actions
      - invalid_strategy
    field_when_repeat: generic when/repeat are static-only; exact Modbus multiwrite
      data/count repeat descriptors are codec-managed
    dependencies: whitelisted operations only; scope and when are annotations
    content_scalar_strategies: runtime uses AFL field projection; values/strategies
      are annotations for CONTENT scalars
    runtime_encode: capability assertion derived from runtime support and message
      direction; never an execution switch
    validator_build: non-BACnet runtime validation requires a C11 compiler (CC or
      cc), protocol_codecs.h and all five protocol_codec_*.c sources; no Python in
      StateAFL mutation loop
