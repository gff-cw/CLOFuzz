scope: Complete TPKT/COTP TP0, session/presentation normal-mode association, ACSE
  AARQ/AARE with embedded MMS initiate, VMD-domain GetNameList, one domain-specific
  named-variable Read/Write, MMS conclude and ACSE/session release, all successful
  request/response layouts. Bounded runtime codec with BER definite lengths and structural
  repair.
